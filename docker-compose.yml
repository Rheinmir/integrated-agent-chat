version: "3.9"

services:
  backend:
    build:
      context: ./backend
      dockerfile: ../Dockerfile
    restart: unless-stopped
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - PORT=8080
      - DB_PATH=/data/agent.db
    volumes:
      - agent_data:/data
    expose:
      - "8080"

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    restart: unless-stopped
    ports:
      - "18080:80"
    depends_on:
      - backend

volumes:
  agent_data:
